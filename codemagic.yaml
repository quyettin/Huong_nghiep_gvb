workflows:
  ionic-ios-workflow:
    name: Ionic iOS Workflow
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install project dependencies
        script: npm install --legacy-peer-deps
      - name: Install Capacitor packages explicitly
        script: npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
      - name: Build web assets
        script: npm run build
      - name: Initialize Capacitor config and add iOS platform
        script: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx @capacitor/cli init "Huong Nghiep GVB" "com.example.huongnghiepgvb" --web-dir dist || true
          fi
          npx @capacitor/cli add ios || true
          npx @capacitor/cli sync ios
      - name: Build ipa
        script: |
          cd ios
          xcodebuild -workspace App/App.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath $HOME/build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive -archivePath $HOME/build/App.xcarchive -exportPath $HOME/export -exportOptionsPlist App/ExportOptions.plist -allowProvisioningUpdates || true
    artifacts:
      - "$HOME/export/*.ipa"
      - "ios/App/build/outputs/ipa/*.ipa"
      - "ios/build/export/*.ipa"
      - "build/**/*.ipa"
