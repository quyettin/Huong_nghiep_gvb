workflows:
  ionic-ios-workflow:
    name: Ionic iOS Workflow
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Install Capacitor CLI explicitly
        script: npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor
        script: npx @capacitor/cli sync ios
      - name: Build ipa
        script: |
          cd ios/App
          cat << EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string></string>
          </dict>
          </plist>
          EOF
          cd ../..

          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath $HOME/build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive -archivePath $HOME/build/App.xcarchive -exportPath $HOME/export -exportOptionsPlist ios/App/ExportOptions.plist -allowProvisioningUpdates || true
    artifacts:
      - "$HOME/export/*.ipa"
      - "ios/App/build/outputs/ipa/*.ipa"
      - "ios/build/export/*.ipa"
      - "build/**/*.ipa"
      - "build/**/*.ipa"
